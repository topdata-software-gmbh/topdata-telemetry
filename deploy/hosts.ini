# Inventory for the topdata-telemetry fleet (all 10 shop-hosting servers).
# Binary architecture (arm64/amd64) is picked per host at deploy time via
# ansible_architecture, no need to encode it here.
[agent]
arm1 ansible_host=arm1.srv.topinfra.de ansible_user=root
arm2 ansible_host=arm2.srv.topinfra.de ansible_user=root
arm3 ansible_host=arm3.srv.topinfra.de ansible_user=root
arm4 ansible_host=arm4.srv.topinfra.de ansible_user=root
arm5 ansible_host=arm5.srv.topinfra.de ansible_user=root
arm6 ansible_host=arm6.srv.topinfra.de ansible_user=root
rs1  ansible_host=rs1.srv.topinfra.de  ansible_user=root
vps1 ansible_host=vps1.srv.topinfra.de ansible_user=root
amd1 ansible_host=amd1.srv.topinfra.de ansible_user=root
trifun ansible_host=trifun.srv.topinfra.de ansible_user=root