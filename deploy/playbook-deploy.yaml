---
# Ansible playbook for deploying topdata-telemetry (read-only Shopware 6
# monitoring agent) to the shop-hosting fleet. Mirrors the package-service
# deploy pattern: binaries cross-compiled locally into deploy/bin/, arch picked
# via ansible_architecture.
#
# Also migrates hosts that still run the legacy topdata-agent unit: the old
# service is stopped/disabled and removed so it cannot hold port 9144, and the
# persisted disk-state file is moved to the new location to keep growth history.

- name: Deploy topdata-telemetry
  hosts: agent
  gather_facts: true
  vars:
    agent_bin: /usr/local/bin/topdata-telemetry
    agent_env_file: /etc/topdata-telemetry.env
    agent_unit: /etc/systemd/system/topdata-telemetry.service
    state_dir: /var/lib/topdata-telemetry
    state_file: /var/lib/topdata-telemetry/disk-state.json
    legacy_bin: /usr/local/bin/topdata-agent
    legacy_env_file: /etc/topdata-agent.env
    legacy_unit: /etc/systemd/system/topdata-agent.service
    legacy_state_file: /var/lib/topdata-agent/disk-state.json
    listen_address: ":9144"
    shops_root: "/srv/topdata-shops/prod-shops"
    vault_file: "{{ playbook_dir }}/vars/vault.yml"
  tasks:
    - name: Check local vault file exists
      ansible.builtin.stat:
        path: "{{ vault_file }}"
      delegate_to: localhost
      run_once: true
      register: vault_file_stat

    - name: Fail with hint if vault is missing
      ansible.builtin.fail:
        msg: >-
          Missing {{ vault_file }}. Create it once with:
          ansible-vault create deploy/vars/vault.yml
          (see deploy/vars/vault.example.yml for the required keys)
      when: not vault_file_stat.stat.exists

    - name: Load vault secrets
      ansible.builtin.include_vars:
        file: "{{ vault_file }}"
      no_log: true

    - name: Map ansible architecture to Go binary name
      ansible.builtin.set_fact:
        agent_arch: "{{ 'arm64' if ansible_facts.architecture in ['aarch64', 'arm64'] else 'amd64' }}"

    - name: Show selected binary for this host
      ansible.builtin.debug:
        msg: "arch={{ agent_arch }} -> deploying deploy/bin/topdata-telemetry-{{ agent_arch }} to {{ agent_bin }}"

    - name: Check local binary exists for this architecture
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/bin/topdata-telemetry-{{ agent_arch }}"
      delegate_to: localhost
      run_once: true
      register: local_bin

    - name: Fail if binary is missing
      ansible.builtin.fail:
        msg: >-
          Missing deploy/bin/topdata-telemetry-{{ agent_arch }}. Build it with
          ./deploy/deploy-to-prod.sh or: GOOS=linux GOARCH={{ agent_arch }} go build -o deploy/bin/topdata-telemetry-{{ agent_arch }} .
      when: not local_bin.stat.exists

    - name: Verify target rsync supports zstd (>= 3.2.0)
      ansible.builtin.command: rsync --version
      register: rsync_ver
      changed_when: false

    - name: Fail fast if target rsync is too old for zstd
      ansible.builtin.fail:
        msg: >-
          rsync >= 3.2.0 with zstd support is required on the target; got:
          {{ rsync_ver.stdout_lines[0] }}
      when: rsync_ver.stdout is not regex('version 3\.[2-9]|version [4-9]')

    - name: Copy agent binary (stripped + zstd-compressed rsync)
      ansible.posix.synchronize:
        src: "{{ playbook_dir }}/bin/topdata-telemetry-{{ agent_arch }}"
        dest: "{{ agent_bin }}"
        compress: yes
        rsync_opts:
          - "--compress-choice=zstd"
          - "--compress-level=3"
        perms: yes
        checksum: yes
      delegate_to: localhost

    - name: Ensure binary is executable
      ansible.builtin.file:
        path: "{{ agent_bin }}"
        mode: "0755"

    - name: Render environment file
      ansible.builtin.template:
        src: templates/topdata-telemetry.env.j2
        dest: "{{ agent_env_file }}"
        mode: "0600"

    - name: Install systemd unit
      ansible.builtin.template:
        src: templates/topdata-telemetry.service.j2
        dest: "{{ agent_unit }}"
        mode: "0644"

    # --- One-time migration from the legacy topdata-agent naming -------------
    - name: Check for legacy topdata-agent unit
      ansible.builtin.stat:
        path: "{{ legacy_unit }}"
      register: legacy_unit_stat

    - name: Stop and disable legacy topdata-agent service
      ansible.builtin.systemd:
        name: topdata-agent
        state: stopped
        enabled: false
      when: legacy_unit_stat.stat.exists

    - name: Ensure state directory exists
      ansible.builtin.file:
        path: "{{ state_dir }}"
        state: directory
        mode: "0755"

    - name: Check legacy disk-state file
      ansible.builtin.stat:
        path: "{{ legacy_state_file }}"
      register: legacy_state_stat

    - name: Check new disk-state file
      ansible.builtin.stat:
        path: "{{ state_file }}"
      register: new_state_stat

    - name: Migrate legacy disk-state (keeps growth history across the rename)
      ansible.builtin.command:
        cmd: mv {{ legacy_state_file }} {{ state_file }}
      when: legacy_state_stat.stat.exists and not new_state_stat.stat.exists

    - name: Enable and (re)start service
      ansible.builtin.systemd:
        name: topdata-telemetry
        state: restarted
        enabled: true
        daemon_reload: true

    - name: Smoke test /healthz endpoint
      ansible.builtin.uri:
        url: http://127.0.0.1:9144/healthz
        status_code: 200
      register: smoke
      until: smoke.status == 200
      retries: 10
      delay: 3
      check_mode: false

    - name: Report deployed binary version
      ansible.builtin.command: "{{ agent_bin }} --version"
      register: agent_version
      changed_when: false

    - name: Show deployed version
      ansible.builtin.debug:
        var: agent_version.stdout

    - name: Verify topdata_telemetry_ metrics are exposed
      ansible.builtin.uri:
        url: http://127.0.0.1:9144/metrics
        user: "{{ auth_username }}"
        password: "{{ auth_password }}"
        force_basic_auth: true
        return_content: true
      register: metrics_check
      failed_when: metrics_check.status != 200 or 'topdata_telemetry_' not in metrics_check.content

    # Cleanup runs only after the new service passed every smoke test: if the
    # rollout fails, the legacy binary, env file and unit are still present, so
    # rollback is just `systemctl enable --now topdata-agent` (the old unit is
    # stopped/disabled but intact until this task succeeds).
    - name: Remove legacy topdata-agent unit, env file and binary
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ legacy_unit }}"
        - "{{ legacy_env_file }}"
        - "{{ legacy_bin }}"

    - name: Reload systemd after legacy unit removal
      ansible.builtin.systemd:
        daemon_reload: true
      when: legacy_unit_stat.stat.exists
